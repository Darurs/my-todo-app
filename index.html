<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0d0f14]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12151c">
  <meta name="description" content="Clean Material Design To-Do App with Star Trek Palette">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Starfleet Directives</title>

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input, select, textarea {
      font-size: 16px !important; /* Prevents iOS/Android auto-zoom on input tap */
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="h-full flex flex-col justify-between text-slate-100 bg-[#0d0f14]">

  <!-- Top App Bar -->
  <header class="bg-[#151922] border-b border-[#252b3b] sticky top-0 z-20 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-[#ff9900] text-black font-extrabold flex items-center justify-center text-lg shadow-sm shadow-[#ff9900]/30">
          <i class="fa-solid fa-list-check pointer-events-none"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white leading-tight">Directives</h1>
          <p class="text-xs text-[#cc99cc]">Starfleet Task Manager</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="sound-btn" type="button" class="w-9 h-9 rounded-full bg-[#1e2433] text-[#ffaa00] flex items-center justify-center hover:bg-[#283044] transition-colors" title="Toggle Beep Feedback">
          <i id="sound-icon" class="fa-solid fa-volume-high text-sm pointer-events-none"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Scrollable Content -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 pb-28 overflow-y-auto">

    <!-- Search Box -->
    <div class="relative mb-3.5">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8b9bb4] text-sm pointer-events-none"></i>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search tasks..." 
        autocomplete="off"
        class="w-full h-11 pl-10 pr-10 bg-[#161b26] border border-[#252c3c] text-white placeholder-[#687790] rounded-xl text-sm focus:outline-none focus:border-[#ff9900] transition-colors">
      <button 
        type="button" 
        id="clear-search" 
        class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-sm pointer-events-none"></i>
      </button>
    </div>

    <!-- Category Filter Chips -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none mb-3" id="category-chips">
      <button type="button" data-cat="all" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#ff9900] text-black whitespace-nowrap shadow-sm">
        All
      </button>
      <button type="button" data-cat="Command" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#161b26] border border-[#273042] text-[#ff7777] whitespace-nowrap">
        Command
      </button>
      <button type="button" data-cat="Operations" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#161b26] border border-[#273042] text-[#ffaa00] whitespace-nowrap">
        Operations
      </button>
      <button type="button" data-cat="Sciences" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#161b26] border border-[#273042] text-[#33bbff] whitespace-nowrap">
        Sciences
      </button>
      <button type="button" data-cat="Medical" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#161b26] border border-[#273042] text-[#cc99cc] whitespace-nowrap">
        Medical
      </button>
      <button type="button" data-cat="Personal" class="cat-pill px-3.5 py-1.5 rounded-full text-xs font-medium bg-[#161b26] border border-[#273042] text-[#34d399] whitespace-nowrap">
        Personal
      </button>
    </div>

    <!-- Status Tabs & Metrics -->
    <div class="flex items-center justify-between bg-[#161b26] border border-[#252c3c] p-1 rounded-xl mb-4">
      <div class="flex items-center gap-1 text-xs">
        <button type="button" id="tab-all" class="tab-btn px-3 py-1.5 rounded-lg bg-[#ff9900] text-black font-semibold">All</button>
        <button type="button" id="tab-active" class="tab-btn px-3 py-1.5 rounded-lg text-slate-300 font-medium">Pending</button>
        <button type="button" id="tab-completed" class="tab-btn px-3 py-1.5 rounded-lg text-slate-300 font-medium">Done</button>
      </div>
      <div class="pr-2.5 text-xs text-slate-400">
        Pending: <span id="pending-count" class="font-bold text-[#ffaa00]">0</span>
      </div>
    </div>

    <!-- Task Cards Container -->
    <div id="tasks-container" class="space-y-2.5">
      <!-- Cards render here dynamically -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-14 px-4 border border-dashed border-[#273145] rounded-2xl mt-4">
      <div class="w-12 h-12 rounded-full bg-[#1a2130] text-[#ff9900] mx-auto flex items-center justify-center text-xl mb-3">
        <i class="fa-solid fa-check"></i>
      </div>
      <h3 class="text-sm font-semibold text-white mb-1">No directives found</h3>
      <p class="text-xs text-slate-400">Tap the orange plus button below to log a new task.</p>
    </div>
  </main>

  <!-- Floating Action Button (FAB) -->
  <div class="fixed bottom-6 right-6 z-30 max-w-xl">
    <button 
      id="open-modal-btn" 
      type="button" 
      class="w-14 h-14 rounded-2xl bg-[#ff9900] text-black flex items-center justify-center shadow-lg shadow-[#ff9900]/30 hover:bg-[#ffaa00] active:scale-95 transition-all text-xl"
      aria-label="Add Task">
      <i class="fa-solid fa-plus pointer-events-none"></i>
    </button>
  </div>

  <!-- Modal Backdrop -->
  <div 
    id="modal-backdrop" 
    class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity duration-200 opacity-0 pointer-events-none">
  </div>

  <!-- Bottom Sheet / Modal -->
  <div 
    id="task-modal" 
    class="fixed bottom-0 left-0 right-0 z-50 bg-[#161b26] border-t border-[#2a3449] rounded-t-3xl p-5 pb-7 max-w-xl mx-auto shadow-2xl transform translate-y-full transition-transform duration-300 pointer-events-none">
    
    <div class="flex items-center justify-between pb-3 mb-3 border-b border-[#252c3c]">
      <h2 class="text-base font-bold text-white">New Task Directive</h2>
      <button 
        id="close-modal-btn" 
        type="button" 
        class="w-8 h-8 rounded-full bg-[#202738] text-slate-400 hover:text-white flex items-center justify-center text-sm">
        <i class="fa-solid fa-xmark pointer-events-none"></i>
      </button>
    </div>

    <form id="task-form" class="space-y-4">
      <div>
        <label for="task-title" class="block text-xs font-semibold text-slate-300 mb-1.5">TASK TITLE</label>
        <input 
          type="text" 
          id="task-title" 
          required 
          placeholder="What needs to be done?" 
          autocomplete="off"
          class="w-full h-11 px-3.5 bg-[#0f131c] border border-[#283244] text-white placeholder-slate-500 rounded-xl text-sm focus:outline-none focus:border-[#ff9900]">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="task-category" class="block text-xs font-semibold text-slate-300 mb-1.5">CATEGORY</label>
          <select 
            id="task-category" 
            class="w-full h-11 px-3 bg-[#0f131c] border border-[#283244] text-white rounded-xl text-sm focus:outline-none focus:border-[#ff9900]">
            <option value="Operations" selected>Operations (Amber)</option>
            <option value="Command">Command (Red)</option>
            <option value="Sciences">Sciences (Cyan)</option>
            <option value="Medical">Medical (Lilac)</option>
            <option value="Personal">Personal (Green)</option>
          </select>
        </div>

        <div>
          <label for="task-priority" class="block text-xs font-semibold text-slate-300 mb-1.5">PRIORITY</label>
          <select 
            id="task-priority" 
            class="w-full h-11 px-3 bg-[#0f131c] border border-[#283244] text-white rounded-xl text-sm focus:outline-none focus:border-[#ff9900]">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High (Urgent)</option>
          </select>
        </div>
      </div>

      <div>
        <label for="task-due" class="block text-xs font-semibold text-slate-300 mb-1.5">DUE DATE (OPTIONAL)</label>
        <input 
          type="date" 
          id="task-due" 
          class="w-full h-11 px-3 bg-[#0f131c] border border-[#283244] text-white rounded-xl text-sm focus:outline-none focus:border-[#ff9900]">
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full h-12 bg-[#ff9900] hover:bg-[#ffaa00] active:scale-[0.98] text-black font-bold text-sm rounded-xl flex items-center justify-center gap-2 shadow-md shadow-[#ff9900]/20 transition-all">
          <i class="fa-solid fa-check pointer-events-none"></i>
          <span>Save Directive</span>
        </button>
      </div>
    </form>
  </div>

  <!-- SCRIPT -->
  <script>
    /* Audio synthesizer for subtle feedback */
    class AudioFeedback {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }
      tap() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }
      complete() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch (e) {}
      }
    }

    const sound = new AudioFeedback();

    function triggerHaptic(ms = 15) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    // STATE
    let tasks = [];
    let activeFilter = 'all';
    let activeCategory = 'all';
    let searchQuery = '';

    // DOM
    const tasksContainer = document.getElementById('tasks-container');
    const emptyState = document.getElementById('empty-state');
    const pendingCount = document.getElementById('pending-count');
    const searchInput = document.getElementById('search-input');
    const clearSearch = document.getElementById('clear-search');
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');

    // MODAL
    const openModalBtn = document.getElementById('open-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const taskModal = document.getElementById('task-modal');
    const taskForm = document.getElementById('task-form');
    const taskTitle = document.getElementById('task-title');

    // STYLE HELPERS
    function getCategoryBadge(cat) {
      switch (cat) {
        case 'Command':
          return `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[#ef4444]/15 text-[#ef4444]">Command</span>`;
        case 'Sciences':
          return `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[#33bbff]/15 text-[#33bbff]">Sciences</span>`;
        case 'Medical':
          return `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[#cc99cc]/15 text-[#cc99cc]">Medical</span>`;
        case 'Personal':
          return `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[#34d399]/15 text-[#34d399]">Personal</span>`;
        case 'Operations':
        default:
          return `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-[#ffaa00]/15 text-[#ffaa00]">Operations</span>`;
      }
    }

    function getPriorityBadge(priority) {
      switch (priority) {
        case 'High':
          return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-[#ef4444]/15 text-[#ef4444] border border-[#ef4444]/30">HIGH</span>`;
        case 'Medium':
          return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-[#ffaa00]/15 text-[#ffaa00] border border-[#ffaa00]/30">MED</span>`;
        case 'Low':
        default:
          return `<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-[#33bbff]/15 text-[#33bbff] border border-[#33bbff]/30">LOW</span>`;
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // STORAGE
    function loadTasks() {
      const data = localStorage.getItem('starfleet_tasks_modern_v1');
      if (data) {
        try { tasks = JSON.parse(data); } catch (e) { tasks = []; }
      }
      if (!tasks || tasks.length === 0) {
        tasks = [
          { id: 1, title: 'Inspect deflector dish alignment', category: 'Operations', priority: 'Medium', due: '', completed: false },
          { id: 2, title: 'Review star chart telemetry updates', category: 'Sciences', priority: 'Low', due: '', completed: false },
          { id: 3, title: 'Schedule bridge crew briefing', category: 'Command', priority: 'High', due: '', completed: true }
        ];
        saveTasks();
      } else {
        render();
      }
    }

    function saveTasks() {
      localStorage.setItem('starfleet_tasks_modern_v1', JSON.stringify(tasks));
      render();
    }

    // RENDER
    function render() {
      const filtered = tasks.filter(t => {
        if (activeFilter === 'active' && t.completed) return false;
        if (activeFilter === 'completed' && !t.completed) return false;
        if (activeCategory !== 'all' && t.category !== activeCategory) return false;
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matchTitle = (t.title || '').toLowerCase().includes(q);
          const matchCat = (t.category || '').toLowerCase().includes(q);
          if (!matchTitle && !matchCat) return false;
        }
        return true;
      });

      pendingCount.textContent = tasks.filter(t => !t.completed).length;
      tasksContainer.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(task => {
          const card = document.createElement('div');
          card.className = `p-3.5 bg-[#161b26] border border-[#252c3c] rounded-2xl flex items-start gap-3 transition-all ${task.completed ? 'opacity-55' : 'hover:border-[#3b465d]'}`;

          card.innerHTML = `
            <button 
              type="button" 
              data-action="toggle" 
              data-id="${task.id}" 
              class="w-6 h-6 mt-0.5 rounded-lg border ${task.completed ? 'bg-[#ff9900] border-[#ff9900] text-black' : 'border-[#3b465d] bg-[#111520] hover:border-[#ff9900]'} flex items-center justify-center flex-shrink-0 transition-colors" 
              aria-label="Toggle status">
              <i class="fa-solid fa-check text-xs pointer-events-none ${task.completed ? 'block' : 'hidden'}"></i>
            </button>

            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium leading-snug break-words ${task.completed ? 'line-through text-slate-400' : 'text-slate-100'}">
                ${escapeHtml(task.title)}
              </p>
              <div class="flex flex-wrap items-center gap-2 mt-2">
                ${getCategoryBadge(task.category)}
                ${getPriorityBadge(task.priority)}
                ${task.due ? `<span class="text-[11px] text-slate-400 flex items-center gap-1"><i class="fa-regular fa-clock pointer-events-none"></i>${task.due}</span>` : ''}
              </div>
            </div>

            <button 
              type="button" 
              data-action="delete" 
              data-id="${task.id}" 
              class="w-8 h-8 rounded-lg text-slate-400 hover:text-[#ef4444] hover:bg-[#ef4444]/10 flex items-center justify-center flex-shrink-0 transition-colors"
              aria-label="Delete directive">
              <i class="fa-regular fa-trash-can text-sm pointer-events-none"></i>
            </button>
          `;
          tasksContainer.appendChild(card);
        });
      }
    }

    // ACTIONS
    tasksContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const id = parseInt(btn.dataset.id, 10);

      if (action === 'toggle') {
        tasks = tasks.map(t => {
          if (t.id === id) {
            const next = !t.completed;
            if (next) sound.complete();
            else sound.tap();
            triggerHaptic(20);
            return { ...t, completed: next };
          }
          return t;
        });
        saveTasks();
      } else if (action === 'delete') {
        sound.tap();
        triggerHaptic(30);
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
      }
    });

    // MODAL OPEN / CLOSE
    function openModal() {
      sound.tap();
      triggerHaptic(15);
      modalBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      taskModal.classList.remove('translate-y-full', 'pointer-events-none');
      setTimeout(() => taskTitle.focus(), 150);
    }

    function closeModal() {
      modalBackdrop.classList.add('opacity-0', 'pointer-events-none');
      taskModal.classList.add('translate-y-full', 'pointer-events-none');
      taskForm.reset();
    }

    openModalBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', closeModal);

    // FORM SUBMIT
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = taskTitle.value.trim();
      if (!title) return;

      const cat = document.getElementById('task-category').value;
      const prio = document.getElementById('task-priority').value;
      const due = document.getElementById('task-due').value;

      tasks.unshift({
        id: Date.now(),
        title: title,
        category: cat,
        priority: prio,
        due: due,
        completed: false
      });

      sound.complete();
      triggerHaptic([15, 30]);
      saveTasks();
      closeModal();
    });

    // SEARCH
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearSearch.classList.toggle('hidden', !searchQuery);
      render();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearch.classList.add('hidden');
      render();
      searchInput.focus();
    });

    // CATEGORY FILTER PILLS
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        sound.tap();
        triggerHaptic(10);
        document.querySelectorAll('.cat-pill').forEach(b => {
          b.classList.remove('bg-[#ff9900]', 'text-black', 'shadow-sm');
          b.classList.add('bg-[#161b26]', 'border', 'border-[#273042]');
        });
        btn.classList.remove('bg-[#161b26]', 'border', 'border-[#273042]');
        btn.classList.add('bg-[#ff9900]', 'text-black', 'shadow-sm');
        activeCategory = btn.dataset.cat;
        render();
      });
    });

    // STATUS TABS
    const tabAll = document.getElementById('tab-all');
    const tabActive = document.getElementById('tab-active');
    const tabCompleted = document.getElementById('tab-completed');
    const tabs = [tabAll, tabActive, tabCompleted];

    function setTab(activeTab, filter) {
      sound.tap();
      triggerHaptic(10);
      tabs.forEach(t => {
        t.classList.remove('bg-[#ff9900]', 'text-black', 'font-semibold');
        t.classList.add('text-slate-300', 'font-medium');
      });
      activeTab.classList.add('bg-[#ff9900]', 'text-black', 'font-semibold');
      activeTab.classList.remove('text-slate-300', 'font-medium');
      activeFilter = filter;
      render();
    }

    tabAll.addEventListener('click', () => setTab(tabAll, 'all'));
    tabActive.addEventListener('click', () => setTab(tabActive, 'active'));
    tabCompleted.addEventListener('click', () => setTab(tabCompleted, 'completed'));

    // SOUND TOGGLE
    soundBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      if (sound.enabled) {
        sound.tap();
        soundIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
        soundBtn.classList.replace('text-slate-500', 'text-[#ffaa00]');
      } else {
        soundIcon.classList.replace('fa-volume-high', 'fa-volume-xmark');
        soundBtn.classList.replace('text-[#ffaa00]', 'text-slate-500');
      }
    });

    // Touch unlock for Web Audio
    const unlock = () => {
      sound.init();
      window.removeEventListener('click', unlock);
      window.removeEventListener('touchstart', unlock);
    };
    window.addEventListener('click', unlock, { passive: true });
    window.addEventListener('touchstart', unlock, { passive: true });

    // Init
    window.addEventListener('DOMContentLoaded', loadTasks);
  </script>
</body>
</html>
