<!DOCTYPE html>
<html lang="en" class="h-full select-none bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Starfleet LCARS Terminal - Mission Directive & Task Management Interface">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LCARS 47 // TASK DIRECTIVES</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --lcars-orange: #ff9900;
      --lcars-amber: #ffaa00;
      --lcars-peach: #ff9966;
      --lcars-salmon: #ff6666;
      --lcars-red: #cc3333;
      --lcars-lilac: #cc99cc;
      --lcars-violet: #9977aa;
      --lcars-sky: #6688cc;
      --lcars-cyan: #33bbff;
      --lcars-gold: #ffcc00;
      --lcars-gray: #556677;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ff9900;
      font-family: 'Antonio', 'Arial Narrow', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      overflow-x: hidden;
    }

    .font-mono-stardate {
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.1em;
    }

    /* LCARS characteristic elbow shapes */
    .lcars-elbow-top {
      border-top-left-radius: 28px;
      border-bottom-left-radius: 0;
    }
    .lcars-elbow-bottom {
      border-bottom-left-radius: 28px;
    }
    .lcars-pill-left {
      border-top-left-radius: 9999px;
      border-bottom-left-radius: 9999px;
    }
    .lcars-pill-right {
      border-top-right-radius: 9999px;
      border-bottom-right-radius: 9999px;
    }
    .lcars-pill {
      border-radius: 9999px;
    }

    /* Scanline overlay for that genuine ship console screen vibe */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.35) 51%,
        rgba(0, 0, 0, 0.35)
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Button active glow states */
    .lcars-btn:active {
      filter: brightness(1.35);
      transform: scale(0.975);
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="h-full flex flex-col justify-between scanlines min-h-screen text-slate-100">

  <!-- TOP LCARS HEADER & ARCH -->
  <header class="w-full bg-black pt-2 px-2 pb-1 border-b border-[#331100]">
    <div class="max-w-xl mx-auto">
      
      <!-- Stardate and system status line -->
      <div class="flex items-center justify-between text-xs font-mono-stardate text-[#ff9900] px-1 pb-1">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#33bbff] animate-ping"></span>
          <span>SYS 47 // USS ENTERPRISE</span>
        </div>
        <div id="stardate-clock" class="text-[#ffaa00] font-bold tracking-wider">
          STARDATE 102456.8
        </div>
      </div>

      <!-- Main LCARS Top Header Elbow Graphic -->
      <div class="flex items-stretch gap-1.5 h-12">
        <!-- Top Left Curved Elbow -->
        <div class="w-24 bg-[#ff9900] lcars-elbow-top flex items-end justify-end p-1.5 text-black font-bold text-xs tracking-tighter">
          LCARS 47
        </div>
        
        <!-- Header Horizontal Bar with cutout aesthetic -->
        <div class="flex-1 bg-[#ff9966] flex items-center justify-between px-3 text-black font-extrabold text-lg tracking-wider">
          <span>TASK DIRECTIVES</span>
          <span class="text-xs tracking-widest font-mono-stardate hidden sm:inline">DECK-10 PRIMARY</span>
        </div>

        <!-- Audio mute toggle button -->
        <button id="sound-toggle-btn" class="w-12 bg-[#cc99cc] hover:bg-[#ff9900] text-black font-bold text-xs flex items-center justify-center lcars-pill-right transition-colors" title="Toggle LCARS Audio">
          <i id="sound-icon" class="fa-solid fa-volume-high text-sm"></i>
        </button>
      </div>

      <!-- Secondary LCARS strip -->
      <div class="flex items-center gap-1.5 mt-1">
        <div class="w-24 h-3 bg-[#6688cc]"></div>
        <div class="flex-1 h-3 bg-[#cc99cc]"></div>
        <div class="w-16 h-3 bg-[#ffaa00] rounded-r-full"></div>
      </div>
    </div>
  </header>

  <!-- MAIN TERMINAL CONTENT -->
  <main class="flex-1 max-w-xl w-full mx-auto p-3 pb-24 overflow-y-auto">

    <!-- Directive Search Interface -->
    <div class="flex items-stretch gap-1.5 mb-3">
      <div class="w-16 bg-[#ff6666] text-black font-bold text-xs flex items-center justify-center lcars-pill-left">
        SRCH
      </div>
      <div class="flex-1 relative">
        <input type="text" id="lcars-search" placeholder="FILTER LOG OR DIRECTIVES..." class="w-full h-10 px-3 bg-[#111116] border-2 border-[#ff9900] text-[#33bbff] placeholder-[#6688cc] font-mono-stardate text-sm focus:outline-none focus:border-[#ffaa00] transition">
        <button id="clear-search-btn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-[#ff6666] hover:text-[#ffaa00]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <button id="refresh-order-btn" class="w-12 bg-[#ffaa00] hover:bg-[#ff9966] text-black font-bold text-xs flex items-center justify-center lcars-pill-right" title="Reset Index">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>

    <!-- STARFLEET DIVISION CHIPS (CATEGORIES) -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-2 scrollbar-none mb-3" id="division-chips">
      <button data-division="all" class="div-chip px-3 py-1.5 bg-[#ff9900] text-black font-bold text-xs lcars-pill transition-all whitespace-nowrap active:scale-95 shadow-sm">
        ALL FLEET
      </button>
      <button data-division="Command" class="div-chip px-3 py-1.5 bg-[#1a0f0f] border border-[#cc3333] text-[#cc3333] hover:bg-[#cc3333] hover:text-black font-bold text-xs lcars-pill transition-all whitespace-nowrap active:scale-95">
        COMMAND
      </button>
      <button data-division="Operations" class="div-chip px-3 py-1.5 bg-[#1f190a] border border-[#ffaa00] text-[#ffaa00] hover:bg-[#ffaa00] hover:text-black font-bold text-xs lcars-pill transition-all whitespace-nowrap active:scale-95">
        OPERATIONS
      </button>
      <button data-division="Sciences" class="div-chip px-3 py-1.5 bg-[#0a1624] border border-[#33bbff] text-[#33bbff] hover:bg-[#33bbff] hover:text-black font-bold text-xs lcars-pill transition-all whitespace-nowrap active:scale-95">
        SCIENCES
      </button>
      <button data-division="Medical" class="div-chip px-3 py-1.5 bg-[#190f1f] border border-[#cc99cc] text-[#cc99cc] hover:bg-[#cc99cc] hover:text-black font-bold text-xs lcars-pill transition-all whitespace-nowrap active:scale-95">
        MEDICAL
      </button>
      <button data-division="Holodeck" class="div-chip px-3 py-1.5 bg-[#0d1c1a] border border-[#2df5a3] text-[#2df5a3] hover:bg-[#2df5a3] hover:text-black font-bold text-xs lcars-pill transition-all whitespace-nowrap active:scale-95">
        HOLODECK
      </button>
    </div>

    <!-- STATUS BAR & METRICS -->
    <div class="flex items-center justify-between bg-[#111116] border border-[#332211] p-1.5 mb-3 lcars-pill">
      <div class="flex items-center gap-1 text-xs">
        <button id="status-all" class="status-selector px-3 py-1 rounded-full bg-[#ff9900] text-black font-bold transition">LOGGED</button>
        <button id="status-pending" class="status-selector px-3 py-1 rounded-full text-[#ffaa00] hover:text-white transition">ACTIVE</button>
        <button id="status-completed" class="status-selector px-3 py-1 rounded-full text-[#ffaa00] hover:text-white transition">FULFILLED</button>
      </div>
      <div class="pr-2 font-mono-stardate text-xs text-[#33bbff] flex items-center gap-1.5">
        <span>PENDING:</span>
        <span id="pending-counter" class="font-bold text-[#ff9966]">0</span>
      </div>
    </div>

    <!-- DIRECTIVES LIST CONTAINER -->
    <div id="tasks-list" class="space-y-2">
      <!-- Generated entries appear here -->
    </div>

    <!-- EMPTY LOG DISPLAY -->
    <div id="empty-state" class="hidden text-center py-12 px-4 border border-dashed border-[#556677] rounded-3xl mt-4">
      <div class="text-4xl text-[#ffaa00] mb-2 font-mono-stardate">000 // NO DIRECTIVES</div>
      <p class="text-xs text-[#6688cc] font-mono-stardate uppercase">The subspace task queue is clear. Awaiting Commander input.</p>
    </div>
  </main>

  <!-- BOTTOM FLOATING ACTION BUTTON (ENGAGE NEW DIRECTIVE) -->
  <div class="fixed bottom-4 right-4 z-40 max-w-xl">
    <button id="open-terminal-sheet" class="lcars-btn h-14 px-5 rounded-full bg-[#ff9900] hover:bg-[#ffaa00] text-black font-extrabold text-sm flex items-center gap-2.5 shadow-[0_0_20px_rgba(255,153,0,0.4)] transition">
      <i class="fa-solid fa-bolt text-base"></i>
      <span>ENGAGE DIRECTIVE</span>
    </button>
  </div>

  <!-- LCARS MODAL OVERLAY -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <!-- LCARS ENTRY SLIDE-UP TERMINAL -->
  <div id="entry-sheet" class="fixed bottom-0 left-0 right-0 z-50 bg-black border-t-4 border-[#ff9900] p-4 transform translate-y-full transition-transform duration-300 max-w-xl mx-auto lcars-elbow-top">
    <!-- Curved Header Bar -->
    <div class="flex items-center justify-between mb-4 pb-2 border-b border-[#331100]">
      <div class="flex items-center gap-2">
        <div class="w-4 h-6 bg-[#ff6666] rounded-l-full"></div>
        <h2 class="text-base font-bold text-[#ff9900] tracking-wider">ENTER STARFLEET DIRECTIVE</h2>
      </div>
      <button id="close-terminal-sheet" class="px-3 py-1 bg-[#cc3333] hover:bg-[#ff6666] text-black font-bold text-xs lcars-pill">
        ABORT [X]
      </button>
    </div>

    <form id="directive-form" class="space-y-3.5">
      <!-- Title -->
      <div>
        <label class="block text-xs font-bold text-[#ffaa00] mb-1">DIRECTIVE OBJECTIVE</label>
        <input type="text" id="directive-title" required placeholder="e.g., Calibrate warp core plasma injectors..." class="w-full h-11 px-3.5 bg-[#111116] border-2 border-[#6688cc] text-[#ffcc00] placeholder-[#556677] font-mono-stardate text-sm rounded-lg focus:outline-none focus:border-[#ff9900]">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- Division -->
        <div>
          <label class="block text-xs font-bold text-[#ffaa00] mb-1">FLEET DIVISION</label>
          <select id="directive-division" class="w-full h-10 px-2.5 bg-[#111116] border-2 border-[#6688cc] text-[#33bbff] font-mono-stardate text-xs rounded-lg focus:outline-none focus:border-[#ff9900]">
            <option value="Command">COMMAND (RED)</option>
            <option value="Operations" selected>OPERATIONS (GOLD)</option>
            <option value="Sciences">SCIENCES (BLUE)</option>
            <option value="Medical">MEDICAL (LILAC)</option>
            <option value="Holodeck">HOLODECK (GREEN)</option>
          </select>
        </div>

        <!-- Alert Status -->
        <div>
          <label class="block text-xs font-bold text-[#ffaa00] mb-1">ALERT CONDITION</label>
          <select id="directive-alert" class="w-full h-10 px-2.5 bg-[#111116] border-2 border-[#6688cc] text-[#ff6666] font-mono-stardate text-xs rounded-lg focus:outline-none focus:border-[#ff9900]">
            <option value="Green">CONDITION GREEN</option>
            <option value="Yellow" selected>YELLOW ALERT</option>
            <option value="Red">RED ALERT</option>
          </select>
        </div>
      </div>

      <!-- Target Stardate / Due -->
      <div>
        <label class="block text-xs font-bold text-[#ffaa00] mb-1">DEADLINE / STARDATE (OPTIONAL)</label>
        <input type="date" id="directive-date" class="w-full h-10 px-3 bg-[#111116] border-2 border-[#6688cc] text-[#ffaa00] font-mono-stardate text-xs rounded-lg focus:outline-none focus:border-[#ff9900]">
      </div>

      <!-- Submit button -->
      <div class="pt-2">
        <button type="submit" class="lcars-btn w-full h-12 bg-[#ffaa00] hover:bg-[#ff9900] text-black font-extrabold text-sm lcars-pill flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(255,170,0,0.3)]">
          <i class="fa-solid fa-terminal"></i>
          <span>TRANSMIT DIRECTIVE TO LOG</span>
        </button>
      </div>
    </form>
  </div>

  <!-- AUDIO SYNTHESIZER AND LCARS CONTROLLER -->
  <script>
    /* Starfleet Web Audio API Synth Engine for Authentic LCARS Chirps and Tones */
    class LcarsAudio {
      constructor() {
        this.ctx = null;
        this.soundEnabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Authentic two-tone LCARS interface beep
      beep(f1 = 987.77, f2 = 1318.51, duration = 0.08) {
        if (!this.soundEnabled) return;
        try {
          this.init();
          const now = this.ctx.currentTime;
          
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(f1, now);
          gain1.gain.setValueAtTime(0.08, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + duration);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(f2, now + 0.04);
          gain2.gain.setValueAtTime(0.08, now + 0.04);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.04);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.04);
          osc2.stop(now + duration + 0.04);
        } catch (e) {
          // Audio context might be restricted before user interaction
        }
      }

      // Completed / Victory chime
      affirmative() {
        if (!this.soundEnabled) return;
        try {
          this.init();
          const notes = [587.33, 880.00, 1174.66]; // D5, A5, D6
          notes.forEach((freq, idx) => {
            const now = this.ctx.currentTime + (idx * 0.07);
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
          });
        } catch(e) {}
      }

      // Red alert purge / delete tone
      purge() {
        if (!this.soundEnabled) return;
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(329.63, now); // E4
          osc.frequency.exponentialRampToValueAtTime(164.81, now + 0.18);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        } catch(e) {}
      }
    }

    const sound = new LcarsAudio();

    // Haptic vibration helper
    function triggerHaptic(pattern = [15]) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch(e) {}
      }
    }

    // STATE VARIABLES
    let directives = [];
    let currentDivision = 'all';
    let currentStatus = 'all'; // all, active, completed
    let searchQuery = '';

    // DOM ELEMENTS
    const tasksList = document.getElementById('tasks-list');
    const emptyState = document.getElementById('empty-state');
    const pendingCounter = document.getElementById('pending-counter');
    const stardateClock = document.getElementById('stardate-clock');
    const lcarsSearch = document.getElementById('lcars-search');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const refreshOrderBtn = document.getElementById('refresh-order-btn');
    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');

    // SHEET MODAL ELEMENTS
    const openSheetBtn = document.getElementById('open-terminal-sheet');
    const closeSheetBtn = document.getElementById('close-terminal-sheet');
    const entrySheet = document.getElementById('entry-sheet');
    const modalOverlay = document.getElementById('modal-overlay');
    const directiveForm = document.getElementById('directive-form');

    // LIVE STARDATE CALCULATION
    // Trek-standard approximation: based on current year/epoch
    function updateStardate() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const dayOfYear = (now - startOfYear) / 86400000;
      const year = now.getFullYear();
      // Generates genuine TNG era formatted stardate: e.g. 58241.3
      const stardateVal = ((year - 2323) * 1000 + (dayOfYear / 365.25) * 1000).toFixed(1);
      stardateClock.textContent = `STARDATE ${stardateVal}`;
    }
    setInterval(updateStardate, 5000);
    updateStardate();

    // COLOR DEFINITIONS FOR DIVISIONS & ALERTS
    function getDivisionStyles(div) {
      switch(div) {
        case 'Command':
          return {
            bar: 'bg-[#cc3333]',
            text: 'text-[#cc3333]',
            border: 'border-[#cc3333]',
            tag: 'CMD'
          };
        case 'Sciences':
          return {
            bar: 'bg-[#33bbff]',
            text: 'text-[#33bbff]',
            border: 'border-[#33bbff]',
            tag: 'SCI'
          };
        case 'Medical':
          return {
            bar: 'bg-[#cc99cc]',
            text: 'text-[#cc99cc]',
            border: 'border-[#cc99cc]',
            tag: 'MED'
          };
        case 'Holodeck':
          return {
            bar: 'bg-[#2df5a3]',
            text: 'text-[#2df5a3]',
            border: 'border-[#2df5a3]',
            tag: 'HOLO'
          };
        case 'Operations':
        default:
          return {
            bar: 'bg-[#ffaa00]',
            text: 'text-[#ffaa00]',
            border: 'border-[#ffaa00]',
            tag: 'OPS'
          };
      }
    }

    function getAlertBadge(alert) {
      switch(alert) {
        case 'Red':
          return `<span class="px-2 py-0.5 rounded bg-[#cc3333]/20 border border-[#cc3333] text-[#cc3333] text-[10px] font-bold tracking-wider animate-pulse">RED ALERT</span>`;
        case 'Yellow':
          return `<span class="px-2 py-0.5 rounded bg-[#ffaa00]/20 border border-[#ffaa00] text-[#ffaa00] text-[10px] font-bold tracking-wider">YELLOW ALERT</span>`;
        case 'Green':
        default:
          return `<span class="px-2 py-0.5 rounded bg-[#33bbff]/20 border border-[#33bbff] text-[#33bbff] text-[10px] font-bold tracking-wider">COND GREEN</span>`;
      }
    }

    // INITIALIZATION & LOCALSTORAGE
    function initLCARS() {
      const stored = localStorage.getItem('lcars_starfleet_directives');
      if (stored) {
        try {
          directives = JSON.parse(stored);
        } catch(e) {
          directives = [];
        }
      } else {
        // Authentic sample directives for immediate mission readiness
        directives = [
          {
            id: 'LCARS-101',
            title: 'Recalibrate magnetic constrictors in Warp Nacelle B',
            division: 'Operations',
            alert: 'Yellow',
            dueDate: '',
            completed: false,
            timestamp: Date.now()
          },
          {
            id: 'LCARS-102',
            title: 'Sensor sweep of Sector 001 for temporal anomalies',
            division: 'Sciences',
            alert: 'Red',
            dueDate: '',
            completed: false,
            timestamp: Date.now() - 3600000
          },
          {
            id: 'LCARS-103',
            title: 'Replicate Raktajino & conduct daily crew checkups',
            division: 'Medical',
            alert: 'Green',
            dueDate: '',
            completed: true,
            timestamp: Date.now() - 7200000
          }
        ];
        saveDirectives();
      }

      renderDirectives();
    }

    function saveDirectives() {
      localStorage.setItem('lcars_starfleet_directives', JSON.stringify(directives));
      renderDirectives();
    }

    // RENDER TASKS WITH LCARS ARCHITECTURE
    function renderDirectives() {
      const filtered = directives.filter(task => {
        if (currentStatus === 'active' && task.completed) return false;
        if (currentStatus === 'completed' && !task.completed) return false;
        if (currentDivision !== 'all' && task.division !== currentDivision) return false;
        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matchTitle = task.title.toLowerCase().includes(q);
          const matchDiv = task.division.toLowerCase().includes(q);
          const matchId = task.id.toLowerCase().includes(q);
          if (!matchTitle && !matchDiv && !matchId) return false;
        }
        return true;
      });

      // Update counters
      const pendingCount = directives.filter(t => !t.completed).length;
      pendingCounter.textContent = pendingCount;

      tasksList.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(task => {
          const divStyle = getDivisionStyles(task.division);
          const item = document.createElement('div');
          
          item.className = `group flex items-stretch gap-1.5 transition-all duration-150 ${task.completed ? 'opacity-50' : 'opacity-100'}`;

          const toggleButton = `
            <button data-id="${task.id}" class="toggle-task-btn w-12 ${task.completed ? 'bg-[#556677] text-[#111116]' : divStyle.bar + ' text-black'} font-extrabold text-xs lcars-pill-left flex items-center justify-center transition active:brightness-125" title="${task.completed ? 'Reactivate Directive' : 'Mark Fulfilled'}">
              ${task.completed ? '<i class="fa-solid fa-check text-sm"></i>' : divStyle.tag}
            </button>
          `;

          const purgeButton = `
            <button data-id="${task.id}" class="delete-task-btn w-10 bg-[#331111] hover:bg-[#cc3333] text-[#cc3333] hover:text-black font-bold text-xs lcars-pill-right flex items-center justify-center transition" title="Purge Directive">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          `;

          item.innerHTML = `
            ${toggleButton}
            <div class="flex-1 bg-[#111116] border-y border-r border-[#222233] p-2.5 flex flex-col justify-between">
              <div class="flex items-start justify-between gap-2">
                <p class="text-sm font-semibold tracking-wide ${task.completed ? 'line-through text-[#667788]' : 'text-[#ffddaa]'} break-words">
                  ${escapeHtml(task.title)}
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2 mt-2 font-mono-stardate text-xs">
                <span class="text-[#ff9900] text-[11px] font-bold">[${task.id}]</span>
                ${getAlertBadge(task.alert)}
                ${task.dueDate ? `<span class="text-[#6688cc] text-[11px]"><i class="fa-regular fa-clock mr-1"></i>${task.dueDate}</span>` : ''}
              </div>
            </div>
            ${purgeButton}
          `;

          tasksList.appendChild(item);
        });
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // TASK TOGGLE & PURGE CLICK EVENTS
    tasksList.addEventListener('click', (e) => {
      const toggleBtn = e.target.closest('.toggle-task-btn');
      const deleteBtn = e.target.closest('.delete-task-btn');

      if (toggleBtn) {
        const id = toggleBtn.dataset.id;
        directives = directives.map(t => {
          if (t.id === id) {
            const nextState = !t.completed;
            if (nextState) {
              sound.affirmative();
              triggerHaptic([30, 40, 30]);
            } else {
              sound.beep(880, 659.25, 0.08);
              triggerHaptic([20]);
            }
            return { ...t, completed: nextState };
          }
          return t;
        });
        saveDirectives();
      }

      if (deleteBtn) {
        const id = deleteBtn.dataset.id;
        sound.purge();
        triggerHaptic([50]);
        directives = directives.filter(t => t.id !== id);
        saveDirectives();
      }
    });

    // OPEN / CLOSE TERMINAL SHEET
    function openModal() {
      sound.beep(1046.50, 1318.51, 0.09);
      triggerHaptic([15]);
      modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
      entrySheet.classList.remove('translate-y-full');
      setTimeout(() => document.getElementById('directive-title').focus(), 150);
    }

    function closeModal() {
      sound.beep(659.25, 523.25, 0.08);
      modalOverlay.classList.add('opacity-0', 'pointer-events-none');
      entrySheet.classList.add('translate-y-full');
    }

    openSheetBtn.addEventListener('click', openModal);
    closeSheetBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', closeModal);

    // FORM SUBMISSION (TRANSMIT DIRECTIVE)
    directiveForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const titleInput = document.getElementById('directive-title');
      const divisionInput = document.getElementById('directive-division');
      const alertInput = document.getElementById('directive-alert');
      const dateInput = document.getElementById('directive-date');

      const title = titleInput.value.trim();
      if (!title) return;

      const randomSectorCode = Math.floor(100 + Math.random() * 900);
      const newDirective = {
        id: `SEC-${randomSectorCode}`,
        title: title,
        division: divisionInput.value,
        alert: alertInput.value,
        dueDate: dateInput.value,
        completed: false,
        timestamp: Date.now()
      };

      sound.affirmative();
      triggerHaptic([20, 50, 20]);

      directives.unshift(newDirective);
      saveDirectives();
      closeModal();
      directiveForm.reset();
    });

    // SEARCH LISTENER
    lcarsSearch.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearSearchBtn.classList.toggle('hidden', !searchQuery);
      renderDirectives();
    });

    clearSearchBtn.addEventListener('click', () => {
      sound.beep(987.77, 659.25, 0.06);
      lcarsSearch.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      renderDirectives();
    });

    refreshOrderBtn.addEventListener('click', () => {
      sound.beep(1318.51, 1567.98, 0.08);
      triggerHaptic([20]);
      directives.sort((a, b) => b.timestamp - a.timestamp);
      renderDirectives();
    });

    // DIVISION CHIPS FILTERING
    document.querySelectorAll('.div-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        sound.beep(1174.66, 1318.51, 0.06);
        triggerHaptic([15]);

        document.querySelectorAll('.div-chip').forEach(b => {
          b.classList.remove('bg-[#ff9900]', 'text-black');
          b.classList.add('bg-[#111116]');
        });

        btn.classList.add('bg-[#ff9900]', 'text-black');
        btn.classList.remove('bg-[#111116]');

        currentDivision = btn.dataset.division;
        renderDirectives();
      });
    });

    // STATUS SELECTORS (ALL / PENDING / COMPLETED)
    const statusAll = document.getElementById('status-all');
    const statusPending = document.getElementById('status-pending');
    const statusCompleted = document.getElementById('status-completed');
    const allStatuses = [statusAll, statusPending, statusCompleted];

    function setStatusFilter(activeEl, status) {
      sound.beep(1046.50, 1174.66, 0.06);
      triggerHaptic([15]);
      allStatuses.forEach(s => {
        s.classList.remove('bg-[#ff9900]', 'text-black', 'font-bold');
        s.classList.add('text-[#ffaa00]');
      });
      activeEl.classList.add('bg-[#ff9900]', 'text-black', 'font-bold');
      activeEl.classList.remove('text-[#ffaa00]');
      currentStatus = status;
      renderDirectives();
    }

    statusAll.addEventListener('click', () => setStatusFilter(statusAll, 'all'));
    statusPending.addEventListener('click', () => setStatusFilter(statusPending, 'active'));
    statusCompleted.addEventListener('click', () => setStatusFilter(statusCompleted, 'completed'));

    // SOUND MUTE TOGGLE
    soundToggleBtn.addEventListener('click', () => {
      sound.soundEnabled = !sound.soundEnabled;
      if (sound.soundEnabled) {
        sound.init();
        sound.beep(880, 1318.51, 0.08);
        soundIcon.classList.replace('fa-volume-xmark', 'fa-volume-high');
        soundToggleBtn.classList.replace('bg-[#556677]', 'bg-[#cc99cc]');
      } else {
        soundIcon.classList.replace('fa-volume-high', 'fa-volume-xmark');
        soundToggleBtn.classList.replace('bg-[#cc99cc]', 'bg-[#556677]');
      }
    });

    // INITIALIZE TERMINAL
    window.addEventListener('DOMContentLoaded', initLCARS);
  </script>
</body>
</html>
